<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atelje Violeta · Beograd</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Raleway:wght@300;400;500;600&display=swap" />

  <style>
/* ───────────────────────────────────────────────────────────────
   Atelje Violeta — single-page styles
   Aesthetic: orthodox-cozy, formal symmetry, lavender + deep
   purple, no iconography. Type echoes the "Buket" tile font
   (Cormorant Garamond, light italic for emotional headlines).
   ─────────────────────────────────────────────────────────────── */

:root {
  --lavender-bg:    #d9cafb;
  --lavender-mid:   #c5b5ec;
  --lavender-soft:  #ecdffa;
  --lavender-pale:  #f5edfd;
  --lavender-deep:  #9a87c4;
  --purple:         #2b1564;
  --purple-2:       #1d0d4a;
  --ink:            #1f0d4a;
  --ink-soft:       #5e4e7d;
  --ink-faint:      rgba(31, 13, 74, 0.55);
  --cream:          #faf7fb;
  --paper:          #ffffff;
  --line:           rgba(31, 13, 74, 0.16);
  --line-soft:      rgba(31, 13, 74, 0.08);
  --line-on-lav:    rgba(43, 21, 100, 0.18);

  --serif:          'Cormorant Garamond', 'Cormorant', 'Garamond', serif;
  --sans:           'Raleway', system-ui, sans-serif;
  --mono:           ui-monospace, 'SF Mono', Menlo, Consolas, monospace;

  --pad-x: clamp(24px, 6vw, 120px);
  --pad-y: clamp(72px, 12vw, 160px);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 400;
  font-size: 15.5px;
  line-height: 1.6;
  letter-spacing: 0.005em;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; }
button { font-family: inherit; }
input, textarea, select { font-family: inherit; color: inherit; }

/* ───── Utility ───── */
.eyebrow {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: inline-block;
}
.display {
  font-family: var(--serif);
  font-weight: 400;
  margin: 0;
  letter-spacing: -0.005em;
  line-height: 1.02;
  color: var(--purple);
}
.display em {
  font-style: italic;
  font-weight: 400;
  color: var(--purple);
}
.lede {
  font-size: 17px;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 56ch;
  margin: 0;
}
.rule {
  width: 56px; height: 1px; background: var(--purple);
  margin: 24px auto;
}
.rule-w { background: rgba(255,255,255,0.6); }

.ornament {
  display: flex; align-items: center; justify-content: center;
  gap: 12px;
  margin: 36px auto;
  color: var(--purple);
  opacity: 0.7;
}
.ornament::before,
.ornament::after {
  content: ''; height: 1px; width: 48px; background: currentColor; opacity: 0.4;
}
.ornament svg { display: block; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  border: none; cursor: pointer;
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase;
  padding: 16px 26px;
  border-radius: 999px;
  transition: transform .2s, background .25s, color .25s, border-color .25s, box-shadow .25s;
  text-decoration: none;
}
.btn-primary {
  background: var(--purple);
  color: #fff;
  box-shadow: 0 2px 0 var(--purple-2), 0 10px 24px rgba(43, 21, 100, 0.18);
}
.btn-primary:hover { background: var(--purple-2); transform: translateY(-1px); box-shadow: 0 4px 0 var(--purple-2), 0 14px 30px rgba(43, 21, 100, 0.22); }
.btn-ghost {
  background: transparent; color: var(--purple);
  border: 1px solid var(--line);
}
.btn-ghost:hover { border-color: var(--purple); color: var(--purple-2); }

/* ───── Topbar ───── */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center;
  padding: 18px var(--pad-x);
  background: rgba(250, 247, 251, 0.94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
.brand {
  display: flex; align-items: baseline; gap: 14px;
  text-decoration: none; color: inherit;
}
.brand-mark {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 500;
  font-size: 26px;
  letter-spacing: -0.005em;
  color: var(--purple);
  line-height: 1;
}
.brand-name {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.32em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.nav {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; gap: 26px;
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--ink-soft);
}
.nav a {
  color: inherit; text-decoration: none; cursor: pointer;
  padding: 4px 0; position: relative;
}
.nav a::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -4px;
  height: 1px; background: var(--purple);
  transform: scaleX(0); transform-origin: left;
  transition: transform .3s;
}
.nav a:hover { color: var(--purple); }
.nav a:hover::after { transform: scaleX(1); }

.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.icon-btn {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: border-color .2s, color .2s, background .2s;
}
.icon-btn:hover { border-color: var(--purple); color: var(--purple); }
.icon-btn.on {
  background: var(--purple); color: #fff; border-color: var(--purple);
}
.lang-switch {
  display: flex; gap: 2px;
  border: 1px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
}
.lang-btn {
  background: transparent; border: none;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  padding: 7px 11px;
  cursor: pointer;
  transition: background .2s, color .2s;
}
.lang-btn:hover { color: var(--purple); }
.lang-btn.on { background: var(--purple); color: #fff; }
.icon-btn .pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; opacity: .8;
  animation: pulse 1.8s ease-in-out infinite;
}
.icon-btn:not(.on) .pulse { animation: none; opacity: .35; }
@keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .35; } 50% { transform: scale(1.1); opacity: 1; } }

.top-cta {
  background: var(--purple); color: #fff;
  border: none; border-radius: 999px;
  padding: 10px 16px;
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  cursor: pointer;
  transition: background .2s, transform .2s;
}
.top-cta:hover { background: var(--purple-2); transform: translateY(-1px); }

/* petal layer */
.petal {
  position: absolute; pointer-events: none;
  border-radius: 50% 0 50% 50%;
  transform: rotate(var(--rot));
  animation: petal-fall 1.6s ease-out forwards;
}
@keyframes petal-fall {
  0% { transform: translate(0, 0) rotate(var(--rot)); opacity: 0.55; }
  100% { transform: translate(var(--dx), -40px) rotate(calc(var(--rot) * 2)); opacity: 0; }
}

/* ─────────────────────────────────────────────────────────────
   HERO
   ───────────────────────────────────────────────────────────── */
.hero {
  position: relative;
  padding: clamp(48px, 6vw, 80px) var(--pad-x) clamp(48px, 6vw, 80px);
  background:
    radial-gradient(ellipse at 50% 30%, rgba(154, 135, 196, 0.25), transparent 60%),
    linear-gradient(180deg, var(--lavender-pale) 0%, var(--cream) 100%);
  text-align: center;
  overflow: hidden;
}
.hero-folio {
  font-family: var(--mono);
  font-size: 10.5px; letter-spacing: 0.42em; text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 24px;
}
.hero-folio::before, .hero-folio::after { content: '·'; margin: 0 14px; opacity: .55; }
.hero-headline {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(48px, 7.2vw, 110px);
  line-height: 0.98;
  letter-spacing: -0.015em;
  color: var(--purple);
  max-width: 18ch;
  margin: 0 auto 28px;
}
.hero-headline em {
  font-style: italic;
  font-weight: 400;
  display: block;
  color: var(--purple);
}
.hero-headline .alt {
  display: block;
  color: var(--purple);
}
.hero-sub {
  font-size: 18px;
  line-height: 1.6;
  color: var(--ink-soft);
  max-width: 56ch;
  margin: 0 auto 40px;
}
.hero-cta-row {
  display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
  margin-bottom: 56px;
}
.hero-tile {
  position: relative;
  width: clamp(280px, 50vw, 640px);
  margin: 0 auto;
  aspect-ratio: 1 / 1;
  background: var(--lavender-bg);
  border-radius: 6px;
  overflow: hidden;
  box-shadow:
    0 30px 80px rgba(43, 21, 100, 0.22),
    0 0 0 1px var(--line-on-lav) inset;
}
.hero-tile::after {
  content: '';
  position: absolute; inset: 10px;
  border-radius: 2px;
  border: 1px solid rgba(255, 255, 255, 0.5);
  pointer-events: none;
}
.hero-tile img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.hero-tag {
  margin-top: 36px;
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--purple);
}

/* ─────────────────────────────────────────────────────────────
   STORY
   ───────────────────────────────────────────────────────────── */
.story {
  padding: var(--pad-y) var(--pad-x);
  background: var(--cream);
}
.story-h {
  text-align: center;
  max-width: 760px;
  margin: 0 auto 56px;
}
.story-h .eyebrow { margin-bottom: 20px; }
.story-h h2 {
  font-size: clamp(36px, 4.5vw, 64px);
  margin: 0;
  text-wrap: balance;
}
.story-h h2 em { display: block; }
.story-h h2 .alt { display: block; }
.story-grid {
  display: grid;
  grid-template-columns: 0.85fr 1fr;
  gap: clamp(40px, 6vw, 96px);
  align-items: center;
  max-width: 1240px;
  margin: 0 auto;
}
.story-portrait {
  position: relative;
  aspect-ratio: 3/4;
  border-radius: 200px 200px 4px 4px;
  background: var(--lavender-bg);
  overflow: hidden;
  box-shadow: 0 16px 50px rgba(43, 21, 100, 0.14), 0 0 0 1px var(--line-on-lav) inset;
}
.story-portrait::before {
  content: '';
  position: absolute; inset: 8px;
  border-radius: 192px 192px 2px 2px;
  border: 1px solid rgba(255,255,255,0.5);
  pointer-events: none;
  z-index: 2;
}
.story-portrait img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  object-position: 50% 25%;
  z-index: 1;
}
.story-text { color: var(--ink); }
.story-text p { font-size: 17px; line-height: 1.7; margin: 0; }
.story-text p + p { margin-top: 18px; }
.story-text .lead-cap {
  float: left;
  font-family: var(--serif); font-style: italic; font-weight: 400;
  font-size: 84px; line-height: 0.85;
  color: var(--purple);
  padding: 6px 14px 0 0;
}
.story-sig {
  margin-top: 32px;
  font-family: var(--serif); font-style: italic;
  font-size: 24px; color: var(--purple);
}
.story-pills {
  margin-top: 28px;
  display: flex; gap: 8px; flex-wrap: wrap;
}
.story-pill {
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  padding: 7px 14px;
  background: var(--lavender-soft); color: var(--purple);
  border-radius: 999px;
}

/* ─────────────────────────────────────────────────────────────
   SERVICES
   ───────────────────────────────────────────────────────────── */
.svc {
  padding: var(--pad-y) var(--pad-x);
  background: var(--lavender-soft);
}
.svc-h { text-align: center; max-width: 760px; margin: 0 auto 56px; }
.svc-h h2 { font-size: clamp(36px, 4.5vw, 60px); margin: 16px 0 0; }
.svc-h h2 em { display: block; }
.svc-h h2 .alt { display: block; }
.svc-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  max-width: 1240px;
  margin: 0 auto;
}
.svc-card {
  background: var(--paper);
  padding: 40px 32px;
  display: flex; flex-direction: column; gap: 16px;
  border-radius: 6px;
  box-shadow: 0 1px 0 var(--line-soft), 0 14px 40px rgba(43, 21, 100, 0.06);
  transition: transform .25s, box-shadow .25s;
}
.svc-card:hover { transform: translateY(-3px); box-shadow: 0 1px 0 var(--line-soft), 0 20px 50px rgba(43, 21, 100, 0.10); }
.svc-card-tag {
  font-family: var(--serif); font-style: italic;
  font-size: 26px; color: var(--lavender-deep);
  border-bottom: 1px solid var(--line-soft);
  padding-bottom: 8px;
}
.svc-card-name {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 32px; line-height: 1.05; margin: 0;
  color: var(--purple);
  letter-spacing: -0.005em;
}
.svc-card-short {
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--ink-soft);
}
.svc-card-body { color: var(--ink-soft); font-size: 14.5px; line-height: 1.65; flex: 1; }
.svc-card-meta {
  font-family: var(--serif); font-style: italic;
  font-size: 20px; color: var(--purple);
  border-top: 1px solid var(--line-soft);
  padding-top: 14px;
}

/* ─────────────────────────────────────────────────────────────
   COLLECTION — horizontal scroller of product tiles
   ───────────────────────────────────────────────────────────── */
.coll {
  padding: var(--pad-y) 0;
  background: var(--cream);
  position: relative;
  overflow: hidden;
}
.coll-h { text-align: center; max-width: 760px; margin: 0 auto 56px; padding: 0 var(--pad-x); }
.coll-h h2 { font-size: clamp(36px, 4.5vw, 60px); margin: 16px 0 0; }
.coll-h h2 em { display: block; }
.coll-h h2 .alt { display: block; }

.product-card {
  display: flex; flex-direction: column;
  gap: 18px;
  cursor: pointer;
  font-family: inherit; color: inherit;
  text-align: center;
  background: transparent;
  border: none; padding: 0;
  width: 100%;
}
.product-card-tile {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  border-radius: 6px;
  background: var(--lavender-bg);
  overflow: hidden;
  box-shadow: 0 14px 40px rgba(43, 21, 100, 0.12), 0 0 0 1px var(--line-on-lav) inset;
  transition: transform .35s ease, box-shadow .35s ease;
}
.product-card:hover .product-card-tile {
  transform: translateY(-4px);
  box-shadow: 0 22px 56px rgba(43, 21, 100, 0.20), 0 0 0 1px var(--line-on-lav) inset;
}
.product-card-tile::after {
  content: '';
  position: absolute; inset: 10px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.5);
  pointer-events: none;
  z-index: 2;
}
.product-card-tile img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.product-card-meta { padding: 0 8px; }
.product-card-num {
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
.product-card-name {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 28px; line-height: 1.1;
  letter-spacing: -0.005em;
  color: var(--purple);
  margin: 0 0 6px;
}
.product-card-desc {
  font-size: 14px; color: var(--ink-soft);
  max-width: 32ch; margin: 0 auto;
  line-height: 1.5;
}
.product-card-cta {
  margin-top: 14px;
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--purple);
  opacity: 0;
  transition: opacity .25s;
}
.product-card:hover .product-card-cta { opacity: 1; }

/* ─────────────────────────────────────────────────────────────
   BRIDES — horizontal scroller of bride portraits
   ───────────────────────────────────────────────────────────── */
.brides {
  padding: var(--pad-y) 0;
  background: var(--lavender-soft);
  overflow: hidden;
  position: relative;
}
.brides-h { text-align: center; max-width: 760px; margin: 0 auto 56px; padding: 0 var(--pad-x); }
.brides-h h2 { font-size: clamp(36px, 4.5vw, 60px); margin: 16px 0 0; }
.brides-h h2 em { display: block; }
.brides-h h2 .alt { display: block; }

.bride-card {
  display: flex; flex-direction: column;
  gap: 16px;
  cursor: default;
  font-family: inherit; color: inherit;
  background: transparent;
  border: none; padding: 0;
  width: 100%;
  text-align: center;
}
.bride-card-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 4px;
  overflow: hidden;
  background: var(--lavender-bg);
  box-shadow: 0 16px 44px rgba(43, 21, 100, 0.18), 0 0 0 1px var(--line-on-lav) inset;
  transition: transform .35s ease, box-shadow .35s ease;
}
.bride-card:hover .bride-card-frame {
  transform: translateY(-4px);
  box-shadow: 0 22px 56px rgba(43, 21, 100, 0.24), 0 0 0 1px var(--line-on-lav) inset;
}
.bride-card-frame::after {
  content: '';
  position: absolute; inset: 12px;
  border-radius: 2px;
  border: 1px solid rgba(255,255,255,0.32);
  pointer-events: none;
  z-index: 2;
}
.bride-card-frame img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.bride-card-caption {
  font-family: var(--serif);
  font-style: italic;
  font-size: 22px;
  color: var(--purple);
  margin: 0;
}
.bride-card-place {
  font-family: var(--mono);
  font-size: 10px; letter-spacing: 0.26em; text-transform: uppercase;
  color: var(--ink-faint);
}

/* ─────────────────────────────────────────────────────────────
   Generic horizontal Scroller framework
   ───────────────────────────────────────────────────────────── */
.scroller {
  position: relative;
}
.scroller-track {
  display: flex;
  gap: var(--gap, 24px);
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  padding: 8px clamp(24px, 8vw, 160px);
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-x: contain;
}
.scroller-track::-webkit-scrollbar { display: none; }
.scroller-card {
  flex: 0 0 var(--card-w, 360px);
  scroll-snap-align: start;
  scroll-snap-stop: always;
}

.scroller-arr {
  position: absolute;
  top: calc(50% - 36px);
  transform: translateY(-50%);
  z-index: 5;
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--purple);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 6px 20px rgba(43, 21, 100, 0.12);
  transition: background .2s, color .2s, border-color .2s, opacity .2s, transform .15s;
}
.scroller-arr:hover { background: var(--purple); color: #fff; border-color: var(--purple); }
.scroller-arr:active { transform: translateY(-50%) scale(0.96); }
.scroller-arr.is-disabled { opacity: 0; pointer-events: none; }
.scroller-arr-l { left: clamp(12px, 4vw, 96px); }
.scroller-arr-r { right: clamp(12px, 4vw, 96px); }

.scroller-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 28px;
}
.scroller-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  border: none;
  background: var(--line);
  cursor: pointer;
  padding: 0;
  transition: background .2s, transform .2s;
}
.scroller-dot:hover { background: var(--lavender-deep); }
.scroller-dot.on { background: var(--purple); transform: scale(1.3); }

/* ─────────────────────────────────────────────────────────────
   BLESSING — quote · hymn · rite (three pillars)
   ───────────────────────────────────────────────────────────── */
.bless {
  padding: clamp(96px, 14vw, 180px) var(--pad-x);
  background:
    radial-gradient(ellipse at 50% 50%, rgba(154, 135, 196, 0.25), transparent 60%),
    var(--lavender-mid);
  text-align: center;
  position: relative;
}
.bless-inner {
  max-width: 880px; margin: 0 auto;
  position: relative;
  padding: 0 16px;
}
.bless .eyebrow { color: var(--purple); margin-bottom: 28px; letter-spacing: 0.42em; }

function useReveal() {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const fallback = setTimeout(() => el.classList.add('is-in'), 200);
    if (!('IntersectionObserver' in window)) return () => clearTimeout(fallback);
    const io = new IntersectionObserver(
      (entries) => {
        entries.forEach((e) => {
          if (e.isIntersecting) { el.classList.add('is-in'); io.unobserve(el); clearTimeout(fallback); }
        });
      },
      { rootMargin: '200px 0px 200px 0px', threshold: 0 },
    );
    io.observe(el);
    return () => { io.disconnect(); clearTimeout(fallback); };
  }, []);
  return ref;
}

function PetalCursor({ color = 'rgba(154, 135, 196, 0.55)' }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    const layer = ref.current;
    if (!layer) return;
    let last = 0, count = 0;
    const onMove = (e) => {
      const now = performance.now();
      if (now - last < 90) return;
      last = now;
      if (count > 16) return;
      count++;
      const x = e.clientX;
      const y = e.clientY;
      const el = document.createElement('span');
      el.className = 'petal';
      const size = 5 + Math.random() * 8;
      const dx = (Math.random() - 0.5) * 60;
      const rot = (Math.random() - 0.5) * 80;
      el.style.cssText = [
        `position:absolute`, `left:${x}px`, `top:${y}px`,
        `width:${size}px`, `height:${size * 1.4}px`,
        `background:${color}`, `--dx:${dx}px`, `--rot:${rot}deg`,
      ].join(';');
      layer.appendChild(el);
      setTimeout(() => { el.remove(); count--; }, 1600);
    };
    window.addEventListener('pointermove', onMove);
    return () => window.removeEventListener('pointermove', onMove);
  }, [color]);
  return (
    <div ref={ref} aria-hidden="true"
      style={{ position: 'fixed', inset: 0, pointerEvents: 'none', zIndex: 1, overflow: 'hidden' }} />
  );
}

function useHymn() {
  const audioRef = React.useRef(null);
  const [on, setOn] = React.useState(false);

  const toggle = () => {
    if (!audioRef.current) {
      const audio = new Audio('assets/hymn.mp3');
      audio.loop = true;
      audio.volume = 0.55;
      audioRef.current = audio;
    }
    if (!on) {
      audioRef.current.play().catch(() => {});
    } else {
      audioRef.current.pause();
    }
    setOn((prev) => !prev);
  };

  React.useEffect(() => () => {
    if (audioRef.current) { audioRef.current.pause(); audioRef.current = null; }
  }, []);

  return { on, toggle };
}

function Ornament({ color }) {

  );
}

function formatDate(d, lang) {
  if (!d) return '';
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString(lang === 'ru' ? 'ru-RU' : lang === 'sr' ? 'sr-Latn-RS' : 'en-GB', {
    day: 'numeric', month: 'long', year: 'numeric',
  });
}

// ─── Scroller ─────────────────────────────────────────────────────────────────
function Scroller({ items, renderItem, cardWidth = 360, gap = 24, ariaLabel, onItemClick }) {
  const trackRef = React.useRef(null);
  const [canLeft, setCanLeft]   = React.useState(false);
  const [canRight, setCanRight] = React.useState(true);
  const [active, setActive]     = React.useState(0);

  const update = React.useCallback(() => {
    const t = trackRef.current;
    if (!t) return;
    setCanLeft(t.scrollLeft > 4);
    setCanRight(t.scrollLeft + t.clientWidth < t.scrollWidth - 4);
    const idx = Math.round(t.scrollLeft / (cardWidth + gap));
    setActive(Math.max(0, Math.min(items.length - 1, idx)));
  }, [items.length, cardWidth, gap]);

  React.useEffect(() => {
    const t = trackRef.current;
    if (!t) return;
    update();
    t.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    return () => { t.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, [update]);

  const step = (dir) => {
    const t = trackRef.current;
    if (!t) return;
    t.scrollBy({ left: dir * (cardWidth + gap), behavior: 'smooth' });
  };

  const goTo = (i) => {
    const t = trackRef.current;
    if (!t) return;
    t.scrollTo({ left: i * (cardWidth + gap), behavior: 'smooth' });
  };

  return (
    <div className="scroller" aria-label={ariaLabel}>
      <button type="button"
        className={`scroller-arr scroller-arr-l ${canLeft ? '' : 'is-disabled'}`}
        onClick={() => step(-1)} aria-label="Prethodno" disabled={!canLeft}>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M11 3L5 9l6 6" />
        </svg>
      </button>
      <button type="button"
        className={`scroller-arr scroller-arr-r ${canRight ? '' : 'is-disabled'}`}
        onClick={() => step(1)} aria-label="Sledeće" disabled={!canRight}>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
          <path d="M7 3l6 6-6 6" />
        </svg>
      </button>
      <div className="scroller-track" ref={trackRef} style={{ '--card-w': `${cardWidth}px`, '--gap': `${gap}px` }}>
        {items.map((it, i) => (
          <div key={it.id || i} className="scroller-card"
            onClick={onItemClick ? () => onItemClick(i) : undefined}
            role={onItemClick ? 'button' : undefined}
            tabIndex={onItemClick ? 0 : undefined}
            onKeyDown={onItemClick ? (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onItemClick(i); } } : undefined}>
            {renderItem(it, i)}
          </div>
        ))}
      </div>
      <div className="scroller-dots" role="tablist" aria-label="Stranica">
        {items.map((_, i) => (
          <button key={i} type="button" className={`scroller-dot ${i === active ? 'on' : ''}`}
            onClick={() => goTo(i)} aria-label={`${i + 1}`} aria-selected={i === active} />
        ))}
      </div>
    </div>
  );
}

// ─── Lightbox ─────────────────────────────────────────────────────────────────
function Lightbox({ items, openIdx, onClose }) {
  const [idx, setIdx] = React.useState(openIdx);
  React.useEffect(() => setIdx(openIdx), [openIdx]);

  React.useEffect(() => {
    if (openIdx == null) return;
    const onKey = (e) => {
      if (e.key === 'Escape') onClose();
      if (e.key === 'ArrowLeft') setIdx((i) => (i - 1 + items.length) % items.length);
      if (e.key === 'ArrowRight') setIdx((i) => (i + 1) % items.length);
    };
    document.addEventListener('keydown', onKey);
    document.body.style.overflow = 'hidden';
    return () => { document.removeEventListener('keydown', onKey); document.body.style.overflow = ''; };
  }, [openIdx, items.length, onClose]);

  if (openIdx == null) return null;
  const item = items[idx];
  return ReactDOM.createPortal(
    <div className="lbx" onClick={onClose} role="dialog" aria-modal="true">
      <button className="lbx-close" onClick={onClose} aria-label="Close">×</button>
      <button className="lbx-arr lbx-l"
        onClick={(e) => { e.stopPropagation(); setIdx((i) => (i - 1 + items.length) % items.length); }}
        aria-label="Prev">‹</button>
      <button className="lbx-arr lbx-r"
        onClick={(e) => { e.stopPropagation(); setIdx((i) => (i + 1) % items.length); }}
        aria-label="Next">›</button>
      <div className="lbx-card" onClick={(e) => e.stopPropagation()}>
        <img src={item.src} alt={item.name} />
      </div>
      <div className="lbx-meta" onClick={(e) => e.stopPropagation()}>
        <div className="lbx-title">{item.name}</div>
        <div className="lbx-sub">{item.desc}</div>
        <div className="lbx-count">{idx + 1} / {items.length}</div>
      </div>
    </div>,
    document.body,
  );
}

const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xeenywzy';

function InquiryForm() {
  const { t, lang } = useLang();
  const q = t.inquiry;
  const f = q.f;
  const [step, setStep] = React.useState(0);
  const [data, setData] = React.useState({
    name: '', partner: '', email: '', phone: '',
    date: '', guests: '', venue: '',
    package: f.packageOpts[0], budget: '', note: '',
  });
  const [done, setDone]       = React.useState(false);
  const [sending, setSending] = React.useState(false);
  const [sendErr, setSendErr] = React.useState(false);
  const [touched, setTouched] = React.useState({});

  const upd = (k, v) => setData((d) => ({ ...d, [k]: v }));

  const stepValid = (s) => {
    if (s === 0) return data.name.trim() && /.+@.+\..+/.test(data.email);
    if (s === 1) return data.date && data.venue.trim();
    return true;
  };

  const submit = async () => {
    setSending(true);
    setSendErr(false);
    try {
      const res = await fetch(FORMSPREE_ENDPOINT, {
        method: 'POST',
        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
        body: JSON.stringify({
          Ime:      data.name,
          Partner:  data.partner,
          Email:    data.email,
          Telefon:  data.phone,
          Datum:    data.date,
          Zvanice:  data.guests,
          Sala:     data.venue,
          Usluga:   data.package,
          Budzet:   data.budget,
          Poruka:   data.note,
        }),
      });
      if (res.ok) { setDone(true); }
      else { setSendErr(true); }
    } catch { setSendErr(true); }
    finally { setSending(false); }
  };

  const next = () => {
    setTouched((tch) => ({ ...tch, [step]: true }));
    if (!stepValid(step)) return;
    if (step < 2) setStep(step + 1);
    else submit();
  };
  const back = () => setStep((s) => Math.max(0, s - 1));

  return (
    <section className="inq" id="inquiry">
      <header className="inq-h">
        <div className="eyebrow">{q.eyebrow}</div>
        <h2 className="display">
          <em>{q.title_a}</em>
          <span className="alt">{q.title_b}</span>
        </h2>
        <Ornament />
        <p className="lede" style={{ margin: '0 auto' }}>{q.sub}</p>
      </header>

      <div className="inq-shell">
        {!done && (
          <>
            <div className="inq-progress">
              {q.steps.map((label, i) => (
                <div key={i} className={`inq-pip ${i === step ? 'on' : ''} ${i < step ? 'past' : ''}`}>
                  <span className="inq-pip-num">{String(i + 1).padStart(2, '0')}</span>
                  <span className="inq-pip-label">{label}</span>
                </div>
              ))}
            </div>

            <div className="inq-step">
              <div className="inq-stepmeta">
                {q.step} <strong>{step + 1}</strong> {q.of} 3 · <span>{q.steps[step]}</span>
              </div>

              {step === 0 && (
                <div className="inq-fields">
                  <Field label={f.name} required>
                    <input value={data.name} onChange={(e) => upd('name', e.target.value)}
                      placeholder={lang === 'ru' ? 'Мария' : lang === 'sr' ? 'Marija' : 'Maria'} />
                  </Field>
                  <Field label={f.partner}>
                    <input value={data.partner} onChange={(e) => upd('partner', e.target.value)} placeholder="Stefan" />
                  </Field>
                  <Field label={f.email} required>
                    <input type="email" value={data.email} onChange={(e) => upd('email', e.target.value)} placeholder="marija@…" />
                  </Field>
                  <Field label={f.phone}>
                    <input value={data.phone} onChange={(e) => upd('phone', e.target.value)} placeholder="063 …" />
                  </Field>
                </div>
              )}

              {step === 1 && (
                <div className="inq-fields">
                  <Field label={f.date} required>
                    <input type="date" value={data.date} onChange={(e) => upd('date', e.target.value)} />
                  </Field>
                  <Field label={f.guests}>
                    <input type="number" min="0" value={data.guests} onChange={(e) => upd('guests', e.target.value)} placeholder="80" />
                  </Field>
                  <Field label={f.venue} required wide>
                    <input value={data.venue} onChange={(e) => upd('venue', e.target.value)}
                      placeholder={lang === 'ru' ? 'Зал, ресторан, место…' : lang === 'sr' ? 'Salon, restoran, mesto…' : 'Venue, restaurant, place…'} />
                  </Field>
                  <Field label={f.package} wide>
                    <div className="inq-radios">
                      {f.packageOpts.map((opt) => (
                        <label key={opt} className={`radio ${data.package === opt ? 'on' : ''}`}>
                          <input type="radio" name="pkg" checked={data.package === opt} onChange={() => upd('package', opt)} />
                          <span>{opt}</span>
                        </label>
                      ))}
                    </div>
                  </Field>
                </div>
              )}

              {step === 2 && (
                <div className="inq-fields">
                  <Field label={f.budget} wide>
                    <div className="inq-radios">
                      {f.budgetOpts.map((opt) => (
                        <label key={opt} className={`radio ${data.budget === opt ? 'on' : ''}`}>
                          <input type="radio" name="bud" checked={data.budget === opt} onChange={() => upd('budget', opt)} />
                          <span>{opt}</span>
                        </label>
                      ))}
                    </div>
                  </Field>
                  <Field label={f.note} wide>
                    <textarea rows="5" value={data.note} onChange={(e) => upd('note', e.target.value)} placeholder={f.notePh} />
                  </Field>
                </div>
              )}

              {touched[step] && !stepValid(step) && (
                <div className="inq-error">
                  {lang === 'ru' ? 'Пожалуйста, заполните обязательные поля (отмечены *).' : lang === 'sr' ? 'Molim popunite obavezna polja (označena *).' : 'Please complete the required fields (marked *).'}
                </div>
              )}

              {sendErr && (
                <div className="inq-error">
                  {lang === 'ru' ? 'Что-то пошло не так. Попробуйте ещё раз или позвоните нам.' : lang === 'sr' ? 'Nešto je pošlo po krivu. Pokušajte ponovo ili nas pozovite.' : 'Something went wrong. Please try again or call us directly.'}
                </div>
              )}

              <div className="inq-nav">
                {step > 0 ? (
                  <button type="button" className="btn btn-ghost" onClick={back}>← {q.back}</button>
                ) : <span />}
                <button type="button" className="btn btn-primary" onClick={next} disabled={sending}>
                  {sending ? '…' : step < 2 ? `${q.next} →` : `${q.submit} ✦`}
                </button>
              </div>
            </div>
          </>
        )}

        {done && (
          <div className="inq-done">
            <div className="inq-done-mark">V</div>
            <h3>
              <em>{q.done_a}</em><br />
              <span>{q.done_b}</span>
            </h3>
            <p>{q.done_sub}</p>
            <dl className="inq-done-summary">
              <div><dt>{f.name}</dt><dd>{data.name}{data.partner && ` + ${data.partner}`}</dd></div>
              <div><dt>{f.date}</dt><dd>{formatDate(data.date, lang)}</dd></div>
              <div><dt>{f.venue}</dt><dd>{data.venue}</dd></div>
              <div><dt>{f.package}</dt><dd>{data.package}</dd></div>
            </dl>
            <button type="button" className="btn btn-ghost"
              onClick={() => { setDone(false); setStep(0); }}>
              {lang === 'ru' ? '← Отправить ещё одну' : lang === 'sr' ? '← Pošaljite još jednu' : '← Send another'}
            </button>
          </div>
        )}
      </div>
    </section>
  );
}

function Field({ label, required, wide, children }) {
  return (
    <label className={`field ${wide ? 'wide' : ''}`}>
      <span className="field-label">
        {label}{required && <span className="req"> *</span>}
      </span>
      {children}
    </label>
  );
}

          onItemClick={() => document.querySelector('#inquiry')?.scrollIntoView({ behavior: 'smooth', block: 'start' })}
          renderItem={(b) => (
            <div className="product-card">
              <div className="product-card-tile">
                <img src={b.src} alt={b.name} />
              </div>
              <div className="product-card-meta">
                <div className="product-card-num">№ {b.num}</div>
                <div className="product-card-name">{b.name}</div>
                <p className="product-card-desc">{b.desc}</p>
                <div className="product-card-cta">{lang === 'ru' ? 'Отправить запрос →' : lang === 'sr' ? 'Pošaljite upit →' : 'Send inquiry →'}</div>
              </div>
            </div>
          )}
        />
      </section>

      {/* Brides */}
      <section className="brides" id="brides">
        <header className="brides-h">
          <div className="eyebrow">{t.brides.eyebrow}</div>
          <h2 className="display">
            <em>{t.brides.title_a}</em>
            <span className="alt">{t.brides.title_b}</span>
          </h2>
          <Ornament />
          <p className="lede" style={{ margin: '8px auto 0' }}>{t.brides.sub}</p>
        </header>
        <Scroller
          items={brideItems}
          cardWidth={320}
          gap={24}
          ariaLabel={t.brides.eyebrow}
          renderItem={(b) => (
            <div className="bride-card">
              <div className="bride-card-frame">
                <img src={b.src} alt={b.caption} />
              </div>
              <div className="bride-card-caption">{b.caption}</div>
              <div className="bride-card-place">{b.place}</div>
            </div>
          )}
        />
      </section>

      {/* Blessing — three pillars: quote · hymn · rite */}
      <section className="bless" id="blessing">
        <div className="bless-inner">
          <div className="eyebrow">{t.blessing.eyebrow}</div>
          <p className="bless-quote">
            <span className="bless-open">{t.blessing.open}</span>
            {t.blessing.body}
            <span className="bless-close">{t.blessing.close}</span>
          </p>
          <div className="bless-sig">— {t.blessing.sig}</div>
        </div>

        <Ornament color="rgba(43, 21, 100, 0.45)" />

        <div className="hymn">
          <div className="eyebrow">{t.hymn.eyebrow}</div>
          <h3 className="hymn-title">{t.hymn.title}</h3>
          <div className="hymn-text">
            {t.hymn.stanzas.map((s, i) => (
              <p key={i} className="hymn-stanza">{s}</p>
            ))}
            <p className="hymn-coda">{t.hymn.coda}</p>
          </div>
          <div className="hymn-attr">{t.hymn.attribution}</div>
        </div>

        <Ornament color="rgba(43, 21, 100, 0.45)" />

        <div className="rite">
          <header className="rite-h">
            <div className="eyebrow">{t.process.eyebrow}</div>
            <h3 className="rite-title">
              <em>{t.process.title_a}</em>
              <span className="alt"> {t.process.title_b}</span>
            </h3>
            <p className="lede" style={{ margin: '20px auto 0' }}>{t.process.sub}</p>
          </header>
          <ol className="rite-steps">
            {t.process.steps.map((step) => (
              <li key={step.num} className="rite-step">
                <div className="rite-step-num">№ {step.num}</div>
                <h4 className="rite-step-name">{step.name}</h4>
                <p className="rite-step-body">{step.body}</p>
              </li>
            ))}
          </ol>
        </div>
      </section>

      {/* Testimonials */}
      <section className="tst">
        <header className="tst-h">
          <div className="eyebrow">{t.testimonials.eyebrow}</div>
          <Ornament />
        </header>
        <div className="tst-grid">
          {t.testimonials.items.map((it, i) => (
            <article key={i} className="tst-card">
              <p className="tst-q">{it.q}</p>
              <div className="tst-who">{it.who}</div>
              <div className="tst-where">{it.where}</div>
            </article>
          ))}
        </div>
      </section>

      {/* Inquiry */}
      <InquiryForm />

      {/* Contact */}
      <section className="ctc" id="contact">
        <header className="ctc-h">
          <div className="eyebrow">{t.contact.eyebrow}</div>
          <h2>
            <em>{t.contact.title_a}</em>
            <span className="alt">{t.contact.title_b}</span>
          </h2>
          <Ornament color="rgba(214, 203, 233, 0.6)" />
        </header>
        <div className="ctc-grid">
          <div className="ctc-card">
            <div className="ctc-label">{t.contact.delivery_l}</div>
            <div className="ctc-value">{t.contact.delivery_v}</div>
            <div className="ctc-note">{t.contact.delivery_n}</div>
          </div>
          <div className="ctc-card">
            <div className="ctc-label">{t.contact.intl_l}</div>
            <div className="ctc-value" style={{ fontSize: '17px', lineHeight: '1.6' }}>{t.contact.intl_v}</div>
            <div className="ctc-note">{t.contact.intl_n}</div>
          </div>
          <div className="ctc-card">
            <div className="ctc-label">{t.contact.location_l}</div>
            <div className="ctc-value">{t.contact.location_v}</div>
          </div>
          <div className="ctc-card">
            <div className="ctc-label">{t.contact.phone_l}</div>
            <div className="ctc-value">{t.contact.phone_v}</div>
          </div>
          <div className="ctc-card">
            <div className="ctc-label">{t.contact.hours_l}</div>
            <div className="ctc-value">{t.contact.hours_v}</div>
          </div>
          <div className="ctc-card">
            <div className="ctc-label">Instagram</div>
            <div className="ctc-value">
              <a href="https://www.instagram.com/ateljevioleta/" target="_blank" rel="noopener noreferrer"
                style={{ color: 'inherit', textDecoration: 'none' }}>
                @ateljevioleta
              </a>
            </div>
          </div>
        </div>
        <div className="ctc-cta">{t.contact.cta}</div>
      </section>

      {/* Footer */}
      <footer className="ftr">
        <div className="ftr-brand"><em>Violeta</em> · {t.foot.tag}</div>
        <a href="https://www.instagram.com/ateljevioleta/" target="_blank" rel="noopener noreferrer"
          className="ftr-insta">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <circle cx="12" cy="12" r="4.5"/>
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
          </svg>
          @ateljevioleta
        </a>
        <div className="ftr-copy">{t.foot.copy}</div>
      </footer>
    </>
  );
}

function App() {
  return (
    <LangProvider>
      <Site />
    </LangProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
